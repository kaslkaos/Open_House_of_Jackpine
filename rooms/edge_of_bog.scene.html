<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge_of_bog.scene</title>
<!-- WAG, the scene. Words written by hand by kaslkaos; turned into code and SVG
     with Claude Opus 5.5, October 2026. Kept here exactly as made, with two
     changes for the portal: no web font (so nothing is fetched from anyone),
     and a faint way back to the room when the scene is opened on its own. -->
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  #stage{position:absolute;left:50%;top:50%;width:1600px;height:1000px;transform-origin:0 0;isolation:isolate;overflow:hidden;background:#000}
  #scene{position:absolute;inset:0;display:block}
  #tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:color;opacity:.45;
        background:linear-gradient(180deg,#1d3f7a 0%,#3a4f86 50%,#1f5a50 57%,#2c6a4a 80%,#1c4a3a 100%);
        transition:opacity 4s ease}
  #text{position:absolute;inset:0;font-family:'IBM Plex Mono',ui-monospace,'DejaVu Sans Mono','Courier New',monospace;font-size:18px;line-height:20px;color:#dcdddd;
        text-shadow:0 0 6px rgba(0,0,0,.7),0 0 1px rgba(0,0,0,.9)}
  .ln{position:absolute;white-space:pre;transition:opacity .15s}
  .ln.reset{color:#eef0ee}
  .cmt{opacity:0;transition:opacity .25s}
  .cmt.on{opacity:1}
  .cur{display:inline-block;width:.62em;height:1.05em;vertical-align:-0.18em;background:#dcdddd;margin-left:1px;animation:blink 1s steps(1) infinite}
  .cur.frozen{animation:none}
  @keyframes blink{50%{opacity:0}}
  #glitch{position:absolute;inset:0;pointer-events:none}
  .band{position:absolute;left:0;width:1600px}
  #black{position:absolute;inset:0;background:#000;opacity:1;pointer-events:none;transition:opacity 3s ease}
  #fogdrift{animation:drift 140s ease-in-out infinite alternate}
  #fogdrift2{animation:drift2 90s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(900px)}}
  @keyframes drift2{from{transform:translateX(0)}to{transform:translateX(-500px)}}
  #dogMove{transition:transform 7s cubic-bezier(.4,0,.2,1);transform-box:fill-box;transform-origin:50% 100%}
  #dogBody,#eyes,#eyesRefl,#ghostL,#ghostR{transition:opacity 1.2s ease}
  .px{opacity:0;transition:opacity .35s steps(2)}
  .px.on{opacity:1}

  /* the way back — only when the scene stands alone, and only when looked for */
  #away{
    position:fixed;left:.9rem;bottom:.8rem;z-index:5;display:none;
    font:12px 'Courier New',ui-monospace,monospace;letter-spacing:.14em;
    color:#8d8f92;text-decoration:none;opacity:0;transition:opacity 1.2s ease;cursor:pointer;
  }
  #away.on{opacity:.7}
  #away:hover,#away:focus-within{opacity:1}
  #away a{color:inherit;text-decoration:none;outline:none}
  #away a:hover,#away a:focus-visible{color:#eef0ee}
</style>
</head>
<body>
<div id="away"><a href="wag.html">← wag</a> · <a href="../index.html">∞⟨🍁∴↯⟩∞ portal</a></div>
<div id="stage">

  <!-- SKY -->

        fill="#26272a" filter="url(#softer)"/>

  <rect y="555" width="1600" height="445" fill="url(#water)"/>
  <rect y="555" width="1600" height="200" fill="#3b3c3f" opacity="0.25" filter="url(#softer)"/>
  <g id="fogdrift2"><rect x="0" y="560" width="2200" height="440" filter="url(#ripple)" opacity="0.18"/></g>

  <!-- LILIES -->

      <use href="#pad" transform="translate(980,628) scale(0.4)"/><use href="#pad" transform="translate(1060,640) scale(0.5)"/></g>
    <g opacity="0.75"><use href="#pad" transform="translate(180,720) scale(0.9)"/><use href="#pad" transform="translate(620,700) scale(0.75)"/>

    <g><use href="#pad" transform="translate(420,830) scale(1.5)"/><use href="#pad" transform="translate(560,868) scale(1.2)"/>

    <!-- grey lilies blossom in pixels -->

        <rect class="px" x="-20" y="-16" width="8" height="8"/><rect class="px" x="-12" y="-16" width="8" height="8" fill="#a9abad"/><rect class="px" x="-4" y="-24" width="8" height="8" fill="#b4b6b8"/><rect class="px" x="4" y="-16" width="8" height="8" fill="#a9abad"/><rect class="px" x="12" y="-16" width="8" height="8"/>
        <rect class="px" x="-12" y="-8" width="8" height="8" fill="#6f7174"/><rect class="px" x="-4" y="-16" width="8" height="8" fill="#c3c5c6"/><rect class="px" x="4" y="-8" width="8" height="8" fill="#6f7174"/><rect class="px" x="-4" y="-8" width="8" height="8" fill="#9a9c9f"/>
      </g>

        <rect class="px" x="-4" y="-16" width="8" height="8" fill="#c3c5c6"/><rect class="px" x="12" y="-16" width="8" height="8"/><rect class="px" x="-4" y="-8" width="8" height="8" fill="#6f7174"/>
      </g>

  <!-- THE DOG -->

  <!-- RESET seams -->
  <g id="seam1" opacity="0.5" transform="translate(0,318)">
    <rect x="0" y="0" width="1600" height="3" fill="#3f4044"/><rect x="0" y="3" width="1600" height="1" fill="#141518"/>
  </g>
  <g id="seam2" opacity="0.5" transform="translate(0,742)"><rect x="0" y="0" width="1600" height="2" fill="#2e2f33"/></g>
  <g id="seam3" opacity="0.35" transform="translate(0,566)">
    <rect x="610" y="0" width="540" height="6" fill="#3d3e42"/><rect x="1190" y="0" width="160" height="6" fill="#28292c"/>

  <rect width="1600" height="1000" fill="url(#vig)"/>

<div id="tint"></div>
<div id="text"></div>

</div>

<script>
/* ---------- the way back: standalone only, appears when the hand moves ---------- */
(()=>{
  let framed=true; try{framed=window.self!==window.top}catch(e){}
  if(framed) return;
  const a=document.getElementById('away');a.style.display='block';
  let hide=0;
  const wake=()=>{a.classList.add('on');document.body.style.cursor='default';
    clearTimeout(hide);hide=setTimeout(()=>{a.classList.remove('on');document.body.style.cursor='none'},2600);};
  addEventListener('pointermove',wake);addEventListener('keydown',wake);
})();

/* ---------- stage fit ---------- */
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1600,innerHeight/1000);
  stage.style.transform=`translate(${-800*s}px,${-500*s}px) scale(${s})`;}
addEventListener('resize',fit);fit();

const $=id=>document.getElementById(id);
const textEl=$('text'), glitchEl=$('glitch'), blackEl=$('black');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------- continuous life ---------- */
const S={bob:1, breath:0, wag:0, waver:1, blinkMain:true, t0:performance.now()};
const pads=$('pads'), tail=$('tail'), sbDisp=$('sbDisp'), skyb=$('skybreath');
let nextBlink=performance.now()+3000;
function eyesSet(sel,ry){document.querySelectorAll(sel).forEach(e=>e.setAttribute('ry',ry))}
function loop(now){
  const t=(now-S.t0)/1000;
  pads.setAttribute('transform',`translate(0,${(Math.sin(t*0.9)*2.2*S.bob).toFixed(2)})`);
  skyb.setAttribute('opacity',(S.breath*(0.06+0.06*Math.sin(t*0.35))).toFixed(3));
  if(S.wag) tail.setAttribute('transform',`rotate(${(Math.sin(t*9)*16*S.wag).toFixed(2)} -88 -12)`);
  sbDisp.setAttribute('scale',(30+8*Math.sin(t*0.7)*S.waver).toFixed(1));
  if(now>nextBlink){ // blink: eyes bright, blinking
    eyesSet('#eyes .eye',0.4);eyesSet('#ghostL .eye',0.3);eyesSet('#ghostR .eye',0.3);
    setTimeout(()=>{eyesSet('#eyes .eye',3.4);eyesSet('#ghostL .eye',2);eyesSet('#ghostR .eye',1.7)},130);
    nextBlink=now+rnd(2500,6500);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- text ---------- */
const LX=58, RX=901.6, LY=43, RY=18, LH=29.35;
const cursor=document.createElement('span');cursor.className='cur';
function line(col,i,cls){
  const d=document.createElement('div');d.className='ln'+(cls?' '+cls:'');
  d.style.left=(col==='L'?LX:RX)+'px';d.style.top=((col==='L'?LY:RY)+i*LH-15)+'px';
  const t=document.createElement('span');d.appendChild(t);
  textEl.appendChild(d);return {d,t};
}
async function type(col,i,str,opt={}){
  const {d,t}=line(col,i,opt.cls);
  const sp=opt.speed||38; let delay=sp;
  cursor.classList.remove('frozen'); d.appendChild(cursor);
  for(let k=0;k<str.length;k++){
    t.textContent+=str[k];
    if(opt.accel) delay=Math.max(6,delay*opt.accel);
    await sleep(str[k]===' '?delay*0.6:delay*rnd(0.7,1.4));
  }
  if(opt.cmt){ // logged: appears whole, nobody types it
    const pad=' '.repeat(Math.max(1,(opt.col||33)-str.length));
    const c=document.createElement('span');c.className='cmt';c.textContent=pad+opt.cmt;
    d.insertBefore(c,cursor);await sleep(30);c.classList.add('on');
  }
  return d;
}
function stamp(col,i,str,cls){const {d,t}=line(col,i,cls);t.textContent=str;return d;}

/* ---------- RESET ---------- */
function moveSeams(){
  $('seam1').setAttribute('transform',`translate(${rnd(-20,20)|0},${rnd(120,500)|0})`);
  $('seam2').setAttribute('transform',`translate(0,${rnd(640,900)|0})`);
  $('seam3').setAttribute('transform',`translate(${rnd(-300,300)|0},${rnd(560,610)|0})`);
}
async function glitch(power=1,blackMs=140){
  const n=Math.round(6+8*power);
  for(let f=0;f<Math.round(4+4*power);f++){
    glitchEl.innerHTML='';
    for(let k=0;k<n;k++){
      const b=document.createElement('div');b.className='band';
      const h=rnd(2,26*power+6);b.style.top=rnd(0,1000)+'px';b.style.height=h+'px';
      const g=rnd(20,90)|0;
      b.style.background=Math.random()<.5?`rgba(${g},${g+2},${g+4},${rnd(.4,.9)})`:'rgba(230,232,228,.08)';
      b.style.transform=`translateX(${rnd(-120,120)*power}px)`;
      glitchEl.appendChild(b);
    }
    textEl.style.transform=`translateX(${rnd(-14,14)*power}px)`;
    stage.style.filter=`contrast(${1+0.6*power}) brightness(${rnd(.8,1.5)})`;
    await sleep(rnd(35,70));
  }
  glitchEl.innerHTML='';textEl.style.transform='';stage.style.filter='';
  blackEl.style.transition='none';blackEl.style.opacity=1;
  moveSeams();
  await sleep(blackMs);
  blackEl.style.opacity=0;
}
async function RESET(col,i,power=1,blackMs=140){
  cursor.remove();
  await glitch(power,blackMs);
  stamp(col,i,'RESET','reset');
  await sleep(500);
}
function flicker(el,times=3){
  (async()=>{for(let k=0;k<times;k++){el.style.opacity=.12;await sleep(rnd(60,160));el.style.opacity=1;await sleep(rnd(40,120));}})();
}

/* ---------- the piece ---------- */
const pixels=[...document.querySelectorAll('.px')];
let pass=0;

async function run(){
  // rebuild
  textEl.innerHTML='';pixels.forEach(p=>p.classList.remove('on'));
  $('dogMove').style.transform='';
  S.bob=1;S.breath=0;S.wag=0;tail.removeAttribute('transform');
  const persist=pass>0;
  $('dogBody').setAttribute('opacity',persist?0.12:0);
  $('eyes').setAttribute('opacity',persist?0.18:0);
  $('eyesRefl').setAttribute('opacity',0);
  $('ghostL').setAttribute('opacity',persist?0.22:0);
  $('ghostR').setAttribute('opacity',persist?0.1:0);
  $('tint').style.transition='none';$("tint").style.opacity=.45;
  $('fogrect').setAttribute('opacity',.5);
  blackEl.style.transition='opacity 4s ease';
  await sleep(300);blackEl.style.opacity=0;
  await sleep(3500);

  await type('L',0,'edge_of_bog.scene  // build 0.0.∞');await sleep(900);
  await type('L',2,'sky      = between(#000000, #808080)');
  S.breath=1;
  const sk=textEl.lastChild; // resolve later, typed on the same line
  {const c=document.createElement('span');sk.insertBefore(c,cursor);
   for(const ch of '   // resolve later'){c.textContent+=ch;await sleep(38)}}
  await sleep(500);
  await type('L',3,'           // later never finishes resolving');await sleep(700);
  await type('L',4,'lilies   = float(); move = false');
  S.bob=0.4;await sleep(300);S.bob=0;await sleep(700);
  await type('L',5,'colour   = budget exhausted');
  $('tint').style.transition='opacity 3.5s ease';$('tint').style.opacity=0;await sleep(1400);
  await type('L',6,'white    = undefined');await sleep(300);
  await type('L',7,'           except: eyes');await sleep(1300);

  await type('L',9,'d o g',{speed:150});await sleep(250);
  await type('L',10,'b o g',{speed:150});await sleep(250);
  const fogLn=await type('L',11,'f o g',{speed:150});$('fogrect').setAttribute('opacity',.62);await sleep(250);
